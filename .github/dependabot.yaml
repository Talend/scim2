version: 2
registries:
  global-artifacts:
    type: maven-repository
    url: https://maven.pkg.github.com/Talend/global-artifacts
    # these secrets should be added for Dependabot on each repo
    username: ${{ secrets.GH_PACKAGES_USER }}
    password: ${{ secrets.GH_PACKAGES_TOKEN }}
  maven-central-remote:
    type: maven-repository
    url: https://artifactory.datapwn.com/artifactory/maven-central-remote
    username: ${{ secrets.ARTIFACTORY_USER }}
    password: ${{ secrets.ARTIFACTORY_PASSWORD }}
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    allow:
      - dependency-type: "all"
    registries:
      - global-artifacts
      - maven-central-remote
    schedule:
      interval: "daily"
    open-pull-requests-limit: 100
    labels:
      - "tpsvc"
      - "cve"
      - "dependencies"
