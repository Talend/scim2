apply plugin: 'maven-publish'

java {
    withSourcesJar()
}

publishing {
    repositories {
        if (project.hasProperty('githubPackagesUsername')) {
            maven {
                credentials {
                    username githubPackagesUsername
                    password githubPackagesPassword
                }
                url 'https://maven.pkg.github.com/Talend/global-artifacts'
            }
        } else {
            mavenLocal()
        }
    }

    publications {
        mavenJava(MavenPublication) {
            artifactId archivesBaseName

            from components.java

            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
        }
    }
}
